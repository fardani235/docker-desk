# .github/workflows/security-gate.yml
name: security-gate
on: [push, pull_request]

permissions:
  contents: read
  id-token: write   # lets the job prove its identity to the control plane (no stored secret)

env:
  SGATE_URL: https://gate.local
  SGATE_PIPELINE: PL-00001

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: curl -fsSL "$SGATE_URL/assets/secure_gate/cli/sgate.py" -o sgate.py

      # Each scanner runs through `sgate run`, which submits the report, or the fact that the
      # scanner failed. Install the scanners however you prefer; they are not shown here.
      - run: python3 sgate.py run --scanner gitleaks --report gitleaks.json --
               gitleaks detect --report-format json --report-path gitleaks.json --exit-code 0
      - run: python3 sgate.py run --scanner trivy --report trivy.json --
               trivy fs --format json --output trivy.json .

      # The step fails, and so does the job, unless the control plane allows it.
      - run: python3 sgate.py evaluate --environment production
