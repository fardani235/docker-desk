# Security gate for a GitHub Actions repository.
#
#   gate     every push and pull request: scan the source, ask the control plane.
#   release  main only: build and sign the image, then gate the artifact for staging.
#   deploy   main only, in the `production` environment: gate again under production policy,
#            and only then deploy.
#
# Setup
#   1. In the control plane, register a pipeline for this repository (CI Provider: GitHub
#      Actions, Authentication: OIDC, Repository: owner/name) and note its id (PL-xxxxx).
#   2. Set the repository variables SGATE_URL and SGATE_PIPELINE.
#   3. Require the status checks of this workflow in branch protection, and protect the
#      `production` environment. Those two settings are what stop someone from merging or
#      deploying around the gate.
#
# No secret is stored in GitHub for the gate: each job proves who it is with a short-lived
# OIDC token that GitHub signs (repository, commit, workflow, environment).

name: security-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SGATE_URL: ${{ vars.SGATE_URL }}
  SGATE_PIPELINE: ${{ vars.SGATE_PIPELINE }}
  IMAGE: ghcr.io/${{ github.repository }}
  # Scanner versions, pinned. Update them deliberately.
  TRIVY: aquasec/trivy:0.76.0
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1
  SEMGREP: semgrep/semgrep:1.181.0
  CHECKOV: bridgecrew/checkov:3.3.29
  ZIZMOR: ghcr.io/zizmorcore/zizmor:1.31.1
  SYFT: anchore/syft:v1.54.1

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the job's identity towards the control plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, for secret scanning
          persist-credentials: false

      - name: Fetch the gate client from the control plane
        run: curl -fsSL "$SGATE_URL/assets/secure_gate/cli/sgate.py" -o "$RUNNER_TEMP/sgate.py"

      # `sgate run` runs the scanner and submits its report. If the scanner crashes or times
      # out, it submits that instead, and the gate treats the evidence as missing. A scanner
      # exiting non-zero because it found something is not a failure of the scanner.
      - name: Secrets (Gitleaks)
        run: >
          python3 "$RUNNER_TEMP/sgate.py" run --scanner gitleaks --report gitleaks.json --
          docker run --rm -v "$PWD:/repo" "$GITLEAKS" detect --source /repo
          --report-format json --report-path /repo/gitleaks.json --exit-code 0

      - name: Static analysis (Semgrep)
        run: >
          python3 "$RUNNER_TEMP/sgate.py" run --scanner semgrep --report semgrep.json --
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP"
          semgrep scan --config auto --json --output semgrep.json

      - name: Dependencies (Trivy)
        run: >
          python3 "$RUNNER_TEMP/sgate.py" run --scanner trivy --report trivy-fs.json --target source --
          docker run --rm -v "$PWD:/src" "$TRIVY" fs --scanners vuln
          --format json --output /src/trivy-fs.json /src

      - name: Infrastructure as code (Checkov)
        run: >
          python3 "$RUNNER_TEMP/sgate.py" run --scanner checkov --report checkov.json --capture-stdout --
          docker run --rm -v "$PWD:/src" "$CHECKOV" -d /src --output json --soft-fail --quiet

      - name: Workflows (zizmor)
        run: >
          python3 "$RUNNER_TEMP/sgate.py" run --scanner zizmor --report zizmor.json --capture-stdout --
          docker run --rm -v "$PWD:/src" -w /src "$ZIZMOR" --format json --offline .

      # Fails the job unless the control plane allows it. Pull requests and branches are
      # gated as development; main is gated as staging in the release job.
      - name: Security gate
        run: python3 "$RUNNER_TEMP/sgate.py" evaluate --environment development

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # control plane identity, and keyless signing
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: curl -fsSL "$SGATE_URL/assets/secure_gate/cli/sgate.py" -o "$RUNNER_TEMP/sgate.py"

      - name: Build and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Image vulnerabilities (Trivy)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: >
          python3 "$RUNNER_TEMP/sgate.py" run --scanner trivy --report trivy-image.json
          --target image --artifact-digest "$DIGEST" --
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY"
          image --format json --output /out/trivy-image.json "$IMAGE@$DIGEST"

      - name: SBOM (Syft)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: >
          python3 "$RUNNER_TEMP/sgate.py" run --scanner syft --report sbom.json --capture-stdout
          --artifact-digest "$DIGEST" --
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT"
          "$IMAGE@$DIGEST" --output cyclonedx-json

      - name: Sign, then verify the signature (Cosign)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SIGNER: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          python3 "$RUNNER_TEMP/sgate.py" run --scanner cosign --report cosign.json --capture-stdout \
            --artifact-digest "$DIGEST" -- \
            cosign verify --output json \
              --certificate-identity "$SIGNER" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE@$DIGEST"

      - name: Security gate (staging)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: python3 "$RUNNER_TEMP/sgate.py" evaluate --environment staging --artifact-digest "$DIGEST"

  deploy:
    needs: release
    runs-on: ubuntu-latest
    # GitHub puts the environment name into the job's OIDC token. The control plane gates
    # this job as production because of that claim; a parameter cannot make it anything else.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - run: curl -fsSL "$SGATE_URL/assets/secure_gate/cli/sgate.py" -o "$RUNNER_TEMP/sgate.py"

      - name: Security gate (production)
        env:
          DIGEST: ${{ needs.release.outputs.digest }}
        run: python3 "$RUNNER_TEMP/sgate.py" evaluate --environment production --artifact-digest "$DIGEST"

      - name: Deploy
        env:
          DIGEST: ${{ needs.release.outputs.digest }}
        run: echo "deploy $IMAGE@$DIGEST here"
